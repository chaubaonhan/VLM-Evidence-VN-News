[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vlmstudy"
version = "1.0.0"
description = "Controlled diagnosis of the evidence vision-language models use to classify Vietnamese news (BN_VN3S_MM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bao Nhan Chau" }, { name = "Anh Hoang" }]
dependencies = ["torch>=2.4", "transformers>=4.57", "accelerate>=1.0", "numpy", "pandas", "pyarrow",
                "pillow", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
ocr = ["easyocr"]

[tool.setuptools.packages.find]
where = ["src"]
